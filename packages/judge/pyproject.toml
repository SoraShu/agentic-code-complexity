[project]
name = "localdataset"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "litellm>=1.87.0",
    "pandas>=3.0.3",
    "pydantic>=2",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "typer>=0.25.1",
]

[project.scripts]
judge = "llm_judge.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "scikit-learn>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_judge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
